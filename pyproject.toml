[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "xray-attenuation"
version = "0.1.0"
description = "X-ray transmission and mass attenuation coefficients for NIST elements and compounds"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Juan Sebastián Useche", email = "juseus@gmail.com" }]
keywords = ["x-ray", "attenuation", "NIST", "beer-lambert", "radiography"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "polars>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
xray-transmission = "xray_attenuation.cli:main"

[project.urls]
Homepage = "https://github.com/juseus03/X-Ray_Mass_Attenuation_DB"
Repository = "https://github.com/juseus03/X-Ray_Mass_Attenuation_DB"

[tool.hatch.build.targets.wheel]
packages = ["src/xray_attenuation"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests", "scripts"]
# Pre-restructure copy of the code, superseded by src/xray_attenuation/.
extend-exclude = ["code"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
